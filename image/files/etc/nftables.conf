#!/usr/sbin/nft -f
# The camera's firewall (SPEC §8 Firewall). Only the tables below are replaced, so a
# restart of nftables.service leaves NetworkManager's own tables (setup mode) alone.

table inet allskyhub
delete table inet allskyhub
table ip allskyhub_nat
delete table ip allskyhub_nat

table inet allskyhub {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # Neighbour discovery, path MTU, ping.
        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept

        # Addresses from the router.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # The local web UI (SPEC §7.4), plain and with HTTPS (§7.6).
        tcp dport { 8080, 8443 } accept
        # The agent's own mDNS responder (SPEC §7.2).
        ip daddr 224.0.0.251 udp dport 5353 accept
        ip6 daddr ff02::fb udp dport 5353 accept
        # SSH, only if the owner turned it on (Raspberry Pi Imager); off in the image.
        tcp dport 22 accept

        # Setup mode (SPEC §7.1): NetworkManager's DHCP and DNS for the phone on the setup
        # network; http://10.42.0.1/ arrives here as port 8080 (see allskyhub_nat).
        ip saddr 10.42.0.0/24 udp dport { 53, 67 } accept
        ip saddr 10.42.0.0/24 tcp dport 53 accept
    }
}

# Setup mode (SPEC §7.1): http://10.42.0.1/ (port 80) reaches the local web UI on 8080.
table ip allskyhub_nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        ip daddr 10.42.0.1 tcp dport 80 redirect to :8080
    }
}
