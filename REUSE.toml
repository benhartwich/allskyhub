# Licensing per path (REUSE, https://reuse.software). The last matching annotation wins.
# Check: uvx reuse lint
version = 1
SPDX-PackageName = "allskyhub"
SPDX-PackageDownloadLocation = "https://github.com/benhartwich/allskyhub"

# Default: server, tools, deployment and repository files.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Documentation and specification.
[[annotations]]
path = ["docs/**", "README.md", "CLAUDE.md"]
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "CC-BY-4.0"

# Protocol models: permissive, so third-party cameras, servers and integrations can use them.
[[annotations]]
path = "packages/protocol/**"
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "Apache-2.0"

# The shared look of hub and camera (CSS, star field) and the shared sky drawing:
# permissive like the protocol.
[[annotations]]
path = ["packages/design/**", "packages/sky/**"]
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "Apache-2.0"

# Camera agent and the Raspberry Pi image.
[[annotations]]
path = ["agent/**", "image/**"]
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Mobile app: permissive, because the GPL conflicts with the App Store terms.
[[annotations]]
path = "app/**"
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "Apache-2.0"

# Vendored third-party files (server/src/allskyhub_server/web/static/VENDORED.md).
[[annotations]]
path = "server/src/allskyhub_server/web/static/htmx.min.js"
SPDX-FileCopyrightText = "Big Sky Software (htmx.org)"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = ["server/src/allskyhub_server/web/static/uplot.min.js", "server/src/allskyhub_server/web/static/uplot.min.css"]
SPDX-FileCopyrightText = "2022 Leon Sorokin"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/design/src/allskyhub_design/static/fonts/space-grotesk.woff2"
SPDX-FileCopyrightText = "2020 The Space Grotesk Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["packages/sky/src/allskyhub_sky/data/constellations.json", "packages/sky/src/allskyhub_sky/data/messier.json"]
SPDX-FileCopyrightText = "2015 Olaf Frohn (d3-celestial)"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "server/src/allskyhub_server/web/static/leaflet/**"
SPDX-FileCopyrightText = "2010-2023 Volodymyr Agafonkin, 2010-2011 CloudMade"
SPDX-License-Identifier = "BSD-2-Clause"
