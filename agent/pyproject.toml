[project]
name = "allskyhub-agent"
version = "0.1.2"
description = "allskyhub camera agent: capture, auto exposure, day/night, storage"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "allskyhub-design",
  "allskyhub-protocol",
  "allskyhub-sky",
  "cryptography>=46",  # Argon2id.verify_phc_encoded (SPEC §7.4)
  "httpx>=0.27",
  "ifaddr>=0.2",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "gpiod>=2.2",  # dew heater and lightning sensor interrupt (SPEC §7.11, §7.12)
  "pillow>=9.4",
  "smbus2>=0.5",  # BME280 and AS3935 on I2C (SPEC §7.11, §7.12)
  "websockets>=13",
  "zeroconf>=0.132",
]

[project.scripts]
allskyhub-agent = "allskyhub_agent.cli:main"

[tool.uv.sources]
allskyhub-design = { workspace = true }
allskyhub-protocol = { workspace = true }
allskyhub-sky = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
