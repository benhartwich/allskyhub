<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Himmel live</title>
  <link rel="stylesheet" href="{{ asset('design/tokens.css') }}">
  <link rel="stylesheet" href="{{ asset('design/base.css') }}">
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <link rel="stylesheet" href="{{ asset('public.css') }}">
  <meta http-equiv="refresh" content="120">
</head>
<body class="widget">
  <a class="widget-link" href="/sky/{{ slug }}" target="_blank" rel="noopener">
    {% if device.latest_image_at %}
    <img class="widget-img" src="/sky/{{ slug }}/latest.jpg?t={{ device.latest_image_at.timestamp() | int }}" alt="Aktuelles Himmelsbild">
    <span class="muted">Aufgenommen {{ device.latest_image_at | clock }} Uhr</span>
    {% else %}
    <div class="sky-ph" aria-hidden="true"></div>
    {% endif %}
    <strong>{{ title }}</strong>{% if profile.location_label %} <span class="muted">· {{ profile.location_label }}</span>{% endif %}
  </a>
</body>
</html>
