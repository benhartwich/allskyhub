# allskyhub.org before a TLS certificate exists: ACME challenge for certbot, the hub on HTTP.
# Replaced by allskyhub.conf once /etc/letsencrypt/live/allskyhub.org/ exists.

log_format allskyhub_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream allskyhub_server {
    server unix:/run/allskyhub-server/api.sock;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name allskyhub.org www.allskyhub.org;
    access_log /var/log/nginx/allskyhub/access.log allskyhub_noquery;
    error_log /var/log/nginx/allskyhub/error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://allskyhub_server;
    }
}
