<label class="check"><input type="checkbox" name="show_coordinates"{% if profile.show_coordinates %} checked{% endif %}><span>{% if en %}Appear on the <a href="/karte">camera map</a> and show coordinates (rounded to 0.1°, about 10 km){% else %}Auf der <a href="/karte">Kamerakarte</a> erscheinen und Koordinaten zeigen (auf 0,1° gerundet, etwa 10 km){% endif %}</span></label>
<label class="check"><input type="checkbox" name="on_home"{% if device.public_on_home %} checked{% endif %}><span>{% if en %}Show on the allskyhub <a href="/">start page</a> (title, place and current image, with a link to the page){% else %}Auf der <a href="/">Startseite</a> von allskyhub zeigen (Titel, Ort und aktuelles Bild, mit Link zur Seite){% endif %}</span></label>
