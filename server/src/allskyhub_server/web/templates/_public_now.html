{%- set fr = device.last_frame or {} -%}
{%- set sky = (device.last_status or {}).get('sky') or {} -%}
<figure class="live">
  {% if device.latest_image_at %}
  {% set ov = sky_overlay(device) %}
  {% set air = air_overlay(device) if profile.sections.aircraft else none %}
  <div class="sky-frame">
  <a href="/sky/{{ slug }}/latest.jpg?t={{ device.latest_image_at.timestamp() | int }}" title="Vollbild" data-lightbox data-caption="Aktuelles Himmelsbild · {{ device.latest_image_at | clock }} Uhr"><img src="/sky/{{ slug }}/latest.jpg?t={{ device.latest_image_at.timestamp() | int }}" alt="Aktuelles Himmelsbild"></a>
  {% if ov %}{% include "_sky_overlay.html" %}{% endif %}
  {% if air %}{% include "_air_overlay.html" %}{% endif %}
  </div>
  {% if ov or air %}<p class="actions">{% if ov %}<button type="button" class="secondary small overlay-toggle" data-overlay-toggle aria-pressed="false">Sternbilder</button>{% endif %}{% if air %} <button type="button" class="secondary small overlay-toggle" data-overlay-toggle="air" aria-pressed="false">Flugzeuge</button><span class="air-credit muted"> {{ air.credit }}</span>{% endif %}</p>{% endif %}
  <figcaption class="now-facts">
    <span class="fact"><small>Aufgenommen</small>{{ device.latest_image_at | clock }} Uhr · {{ device.latest_image_at | age }}</span>
    {% if fr.mode is defined %}<span class="fact"><small>Modus</small>{{ 'Nacht' if fr.mode == 'night' else 'Tag' }}</span>{% endif %}
    {% if fr.sun_elevation is defined %}<span class="fact"><small>Sonne</small>{{ '%.1f' | format(fr.sun_elevation) }}°</span>{% endif %}
    {% if fr.exposure_us is defined %}<span class="fact"><small>Belichtung</small>{{ '%.3g' | format(fr.exposure_us / 1e6) | replace('.', ',') }} s</span>{% endif %}
    {% if fr.gain is defined %}<span class="fact"><small>Gain</small>{{ fr.gain | round | int }}</span>{% endif %}
    {% if sky.cloud_cover is number %}<span class="fact"><small>Bewölkung</small>{{ (sky.cloud_cover * 100) | round | int }} %</span>{% endif %}
    {% if sky.sqm_mag is number %}<span class="fact"><small>Himmelshelligkeit</small>{{ '%.2f' | format(sky.sqm_mag) | replace('.', ',') }} mag/″²</span>{% endif %}
    {% if sky.stars is number %}<span class="fact"><small>Sterne</small>{{ sky.stars }}</span>{% endif %}
  </figcaption>
  {% else %}
  <div class="sky-ph" aria-hidden="true"></div>
  <figcaption class="muted">Noch kein Bild.</figcaption>
  {% endif %}
</figure>
