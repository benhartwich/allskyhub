    </linearGradient>
    <radialGradient id="a1" cx=".15" cy="-.05" r=".8"><stop offset="0" stop-color="#4fe3b0" stop-opacity=".35"/><stop offset=".6" stop-color="#4fe3b0" stop-opacity="0"/></radialGradient>
    <radialGradient id="a2" cx=".9" cy="0" r=".75"><stop offset="0" stop-color="#b48cff" stop-opacity=".38"/><stop offset=".6" stop-color="#b48cff" stop-opacity="0"/></radialGradient>
