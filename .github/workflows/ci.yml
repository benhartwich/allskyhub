# Checks required before merging (CLAUDE.md): ruff, pyright strict, pytest, REUSE.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    # Hub tests (server/tests) need PostgreSQL; without the URL they are skipped.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allskyhub
          POSTGRES_PASSWORD: allskyhub
          POSTGRES_DB: allskyhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allskyhub" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ALLSKYHUB_SERVER_TEST_DATABASE_URL: postgresql://allskyhub:allskyhub@127.0.0.1:5432/allskyhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q -rs
      - run: uvx --from 'reuse[charset-normalizer]' reuse lint

  # Flutter app (app/): format, analyze, test. Builds run on Codemagic (codemagic.yaml).
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
