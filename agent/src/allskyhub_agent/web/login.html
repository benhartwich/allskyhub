<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>Anmelden – allskyhub-Kamera</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="theme.js"></script>
<link rel="stylesheet" href="static/design/tokens.css">
<link rel="stylesheet" href="static/design/base.css">
</head>
<body>
<header class="appbar">
  <span class="brand"><img src="favicon.svg" width="28" height="28" alt="">allskyhub</span>
  <nav class="appbar-end">
    <button type="button" class="nav-link" data-theme-toggle title="Rotlicht für die Nacht" aria-label="Rotlicht für die Nacht">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </nav>
</header>
<main class="auth">
  <h1>Kamera anmelden</h1>
  <p class="msg error" id="error" role="alert" hidden></p>
  <section class="card stack">
    <a class="button" href="local-login/start">Mit allskyhub anmelden</a>
    <p class="muted small">Mit dem Konto, dem diese Kamera gehört.</p>
  </section>
  <section class="card stack">
    <form method="post" action="local-login/code" class="stack">
      <label for="code">Offline-Code</label>
      <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false"
             placeholder="XXXX-XXXX-XXXX" required>
      <button class="secondary" type="submit">Mit Code anmelden</button>
    </form>
    <p class="muted small">Falls der Hub nicht erreichbar ist. Den Code erzeugst du in den
      Kamera-Einstellungen auf allskyhub.</p>
  </section>
</main>
<script>
const MESSAGES = {
  wrong: "Der Code stimmt nicht.",
  locked: "Zu viele Fehlversuche. Bitte 15 Minuten warten oder mit allskyhub anmelden.",
  no_code: "Für diese Kamera ist kein Offline-Code eingerichtet.",
  failed: "Die Anmeldung über allskyhub hat nicht geklappt. Bitte noch einmal versuchen.",
};
const e = new URLSearchParams(location.search).get("e");
if (e && MESSAGES[e]) {
  const el = document.getElementById("error");
  el.textContent = MESSAGES[e];
  el.hidden = false;
}
</script>
</body>
</html>
