[project]
name = "allskyhub-agent"
version = "0.1.0"
description = "allskyhub camera agent: capture, auto exposure, day/night, storage"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "allskyhub-protocol",
  "cryptography>=41",
  "httpx>=0.27",
  "ifaddr>=0.2",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=9.4",
  "websockets>=13",
  "zeroconf>=0.132",
]

[project.scripts]
allskyhub-agent = "allskyhub_agent.cli:main"

[tool.uv.sources]
allskyhub-protocol = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
