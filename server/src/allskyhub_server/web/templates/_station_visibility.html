{# SPEC §10.6 Visibility: the owner's four choices, when connecting and on the station's page.
   `vis` is devices/public.py Visibility; the hidden field tells unticked boxes from none sent. #}
<input type="hidden" name="visibility" value="1">
<label class="check"><input type="checkbox" name="named" value="true"{% if vis.named %} checked{% endif %}> <span>{{ t('Mit Namen nennen', 'Name it') }}<br><span class="muted small">{{ t('Sonst steht in Ergebnissen und Listen „eine Station im Netz“, auch in Exporten an Partner.', 'Otherwise results and lists say "a station in the network", also in exports to partners.') }}</span></span></label>
<label class="check"><input type="checkbox" name="on_map" value="true"{% if vis.on_map %} checked{% endif %}> <span>{{ t('Auf der Netzkarte', "On the network's map") }}<br><span class="muted small">{{ t('Der Ort auf etwa 10 km gerundet.', 'The place rounded to about 10 km.') }}</span></span></label>
<label class="check"><input type="checkbox" name="page" value="true"{% if vis.page %} checked{% endif %}> <span>{{ t('Öffentliche Seite', 'Public page') }}<br><span class="muted small">{{ t('Himmel, Meteore und was die Station zum Netz beiträgt.', 'Sky, meteors and what the station adds to the network.') }}</span></span></label>
<label class="check"><input type="checkbox" name="images" value="true"{% if vis.images %} checked{% endif %}> <span>{{ t('Bilder zeigen', 'Show images') }}<br><span class="muted small">{{ t('Letztes Bild und Meteorbilder auf der öffentlichen Seite.', 'The latest image and meteor images on the public page.') }}</span></span></label>
