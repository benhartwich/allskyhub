# Codemagic builds of the Flutter app (app/, SPEC §2, M3).
#
# The iOS release reads its keys from the app's secure variable group "allskyhub_store",
# which the hub fills: admin page → App-Stores → "Prüfen und einrichten"
# (server/src/allskyhub_server/admin/stores.py): the App Store Connect API key and the
# private key of the iOS distribution certificate (made by the hub). No App Store Connect
# integration in the Codemagic UI is needed. Android store builds run on the hub's own
# server (deploy/android/README.md).
# The check workflow needs none of that.
#
# SECURITY: builds start only by hand (hub admin or Codemagic UI). No `triggering`, never a
# pull_request trigger: this repository is public, and a build of a fork's pull request
# with allskyhub_store would expose the team-wide App Store Connect key and the
# distribution certificate key (bortle_store holds the same). Changing this needs
# Benjamin's explicit approval.

definitions:
  flutter: &flutter
    flutter: stable
  app_dir: &app_dir
    working_directory: app
  scripts:
    - &get
      name: Packages
      script: flutter pub get
    - &check
      name: Analyze and test
      script: |
        dart format --output=none --set-exit-if-changed lib test
        flutter analyze
        flutter test

workflows:
  # Manual: analyze, test, debug APK, unsigned iOS build. Every app change is already
  # compiled on GitHub Actions (.github/workflows/app-build.yml); this one saves mac minutes.
  app-check:
    name: App check
    instance_type: mac_mini_m2
    max_build_duration: 45
    <<: *app_dir
    environment:
      <<: *flutter
      xcode: latest
    scripts:
      - *get
      - *check
      - name: Android debug APK
        script: flutter build apk --debug
      - name: iOS build without signing
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  # Manual: signed iOS build to TestFlight. The certificate and profile come from Apple
  # with the hub's key (fetch-signing-files --create makes them on the first run).
  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    <<: *app_dir
    environment:
      <<: *flutter
      xcode: latest
      groups: [allskyhub_store]
    scripts:
      - *get
      - *check
      - name: Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files org.allskyhub.app --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
