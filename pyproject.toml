[tool.uv.workspace]
members = ["packages/protocol", "agent"]

[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.13",
  "pyright[nodejs]>=1.1.405",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "DTZ", "RUF", "PT", "TID", "C4", "RET", "PTH"]
ignore = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["allskyhub_protocol", "allskyhub_agent"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["packages", "agent"]
exclude = ["**/__pycache__", ".venv"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["packages/protocol/tests", "agent/tests"]
addopts = "--import-mode=importlib"
