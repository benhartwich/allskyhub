{% extends "base.html" %}
{% block title %}Anmelden · allskyhub{% endblock %}
{% block content %}
<div class="auth">
  <h1>Anmelden</h1>
  <form method="post" action="/login" class="card stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label>E-Mail-Adresse
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required>
    </label>
    <label>Passwort
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Anmelden</button>
  </form>
  <p class="muted">Noch kein Konto? Der Zugang ist derzeit nur auf Einladung möglich.</p>
</div>
{% endblock %}
