# allskyhub hub for nginx (Debian 13), installed as /etc/nginx/sites-available/allskyhub.conf.
# Needs the certificate /etc/letsencrypt/live/allskyhub.org/ (allskyhub.org + www.allskyhub.org).
# sites-enabled/* is included inside http {}, so zones and formats can live here.

# Never log query strings.
log_format allskyhub_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent $request_time "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=allskyhub_login:10m rate=20r/m;

upstream allskyhub_server {
    server unix:/run/allskyhub-server/api.sock;
    keepalive 16;
}

map $http_upgrade $allskyhub_connection {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name allskyhub.org www.allskyhub.org;
    access_log /var/log/nginx/allskyhub/access.log allskyhub_noquery;
    error_log /var/log/nginx/allskyhub/error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://allskyhub.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.allskyhub.org;
    ssl_certificate     /etc/letsencrypt/live/allskyhub.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allskyhub.org/privkey.pem;
    access_log /var/log/nginx/allskyhub/access.log allskyhub_noquery;
    return 301 https://allskyhub.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name allskyhub.org;

    ssl_certificate     /etc/letsencrypt/live/allskyhub.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allskyhub.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:allskyhub_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/allskyhub/access.log allskyhub_noquery;
    error_log /var/log/nginx/allskyhub/error.log;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript;

    location / {
        proxy_pass http://allskyhub_server;
    }

    location = /login {
        limit_req zone=allskyhub_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://allskyhub_server;
    }

    # Device WebSocket (SPEC §6.1): long-lived, the device reconnects on its own.
    location = /device/v1/ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $allskyhub_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://allskyhub_server;
    }

    # Frame uploads (SPEC §6.5): JPEG up to ALLSKYHUB_SERVER_MAX_IMAGE_MB (25).
    location ~ "^/device/v1/frames/" {
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_pass http://allskyhub_server;
    }
}
