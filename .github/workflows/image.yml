# allskyhub image for the Raspberry Pi 4 and 5 (SPEC §8, M5).
# Native build on an arm64 runner; the image is a workflow artifact for 14 days, and a tag
# agent-vX.Y.Z also attaches it as allskyhub-X.Y.Z.img.xz to that release (docs/install.md).
name: image

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    # A tag agent-vX.Y.Z publishes the update bundle (docs/updates.md); paths don't apply.
    tags: ["agent-v*"]
    paths:
      - "image/**"
      - "agent/**"
      - "packages/protocol/**"
      - "packages/design/**"
      - "packages/sky/**"
      - "uv.lock"
      - ".github/workflows/image.yml"
      - "tools/e2e/**"
      - "tools/release/**"

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends parted e2fsprogs xz-utils
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: image
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          # A released image carries the agent's version, so its file name says what is in it.
          case "$GITHUB_REF" in refs/tags/agent-v*) VERSION="${GITHUB_REF_NAME#agent-v}" ;; esac
          sudo env UV_BIN="$(command -v uv)" ALLSKYHUB_IMAGE_VERSION="$VERSION" image/build.sh
          sudo chown -R "$(id -u):$(id -g)" build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: allskyhub-image
          path: |
            build/allskyhub-*.img.xz
            build/allskyhub-*.img.xz.sha256
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: allskyhub-agent-bundle
          path: build/allskyhub-agent-*-arm64.tar.xz
          retention-days: 14
          compression-level: 0

  # SPEC §8 end to end: the built image installs a newer release, rolls it back when asked
  # and rolls back a broken one by itself (tools/e2e/update-e2e.sh, roadmap S9).
  update-e2e:
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends systemd-container xz-utils openssl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: allskyhub-image
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: allskyhub-agent-bundle
          path: build
      - name: update, rollback, broken release
        run: sudo tools/e2e/update-e2e.sh build/allskyhub-*.img.xz build/allskyhub-agent-*-arm64.tar.xz

  # SPEC §8: sign the manifest and publish it with the bundle. The private key is only in
  # the secret ALLSKYHUB_UPDATE_KEY; without it nothing is published.
  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: [build, update-e2e]
    runs-on: ubuntu-26.04
    # The signing key is a secret of this environment only; it requires Benjamin's approval
    # for every run (security review 2026-10-13, roadmap S4).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_KEY: ${{ secrets.ALLSKYHUB_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: tag is on main
        run: |
          # Anyone who may push a tag must not be able to sign a commit that never went
          # through review on main.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: allskyhub-agent-bundle
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: allskyhub-image
          path: image-dist
      - name: version
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          AGENT=$(sed -n 's/^version = "\(.*\)"$/\1/p' agent/pyproject.toml | head -n 1)
          [ "$VERSION" = "$AGENT" ] || { echo "tag $VERSION != agent $AGENT"; exit 1; }
          # What's new (SPEC §8): every release has its entry; it is also the release notes.
          python3 tools/release/release_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: manifest and signature
        run: |
          [ -n "$UPDATE_KEY" ] || { echo "::error::secret ALLSKYHUB_UPDATE_KEY is not set"; exit 1; }
          BUNDLE="dist/allskyhub-agent-$VERSION-arm64.tar.xz"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/agent-v$VERSION/allskyhub-agent-$VERSION-arm64.tar.xz"
          python3 tools/release/make_manifest.py "$BUNDLE" "$VERSION" "$URL" > dist/manifest.json
          umask 077
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin \
            -in dist/manifest.json -out dist/manifest.json.sig
          rm -f "$RUNNER_TEMP/key.pem"
          # The signature must verify with a key the cameras trust.
          ok=0
          for k in image/files/etc/allskyhub-agent/update-keys/*.pem; do
            [ -e "$k" ] || continue
            openssl pkeyutl -verify -pubin -inkey "$k" -rawin -in dist/manifest.json \
              -sigfile dist/manifest.json.sig && ok=1 && break
          done
          [ "$ok" = 1 ] || { echo "::error::signature does not match a key in the image"; exit 1; }
      - name: publish
        run: |
          # The SD image for new cameras (docs/install.md) goes with the agent it contains.
          IMAGE="image-dist/allskyhub-$VERSION.img.xz"
          [ -f "$IMAGE" ] && [ -f "$IMAGE.sha256" ] || { echo "::error::$IMAGE missing"; exit 1; }
          ASSETS=("dist/allskyhub-agent-$VERSION-arm64.tar.xz" "$IMAGE" "$IMAGE.sha256")
          gh release create "agent-v$VERSION" "${ASSETS[@]}" \
            --title "agent $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release upload "agent-v$VERSION" "${ASSETS[@]}" --clobber
          gh release view channel-stable >/dev/null 2>&1 || gh release create channel-stable \
            --title "update channel: stable" --notes "Manifest the cameras read (docs/updates.md)." --latest=false
          gh release upload channel-stable dist/manifest.json dist/manifest.json.sig --clobber
