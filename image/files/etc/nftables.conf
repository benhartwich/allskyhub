#!/usr/sbin/nft -f
# Setup mode (SPEC §7.1): http://10.42.0.1/ (port 80) reaches the local web UI on 8080.
flush ruleset

table ip allskyhub_nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        ip daddr 10.42.0.1 tcp dport 80 redirect to :8080
    }
}
