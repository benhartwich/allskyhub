[project]
name = "allskyhub-server"
version = "0.1.0"
description = "allskyhub hub: accounts, device pairing, live and latest images (SPEC §2, M2)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "allskyhub-protocol",
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
  "sqlalchemy[asyncio]>=2.0.43",
  "asyncpg>=0.30",
  "alembic>=1.16",
  "argon2-cffi>=25.1",
  "jinja2>=3.1.6",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  # Ed25519 signature checks of devices (SPEC §6.2).
  "cryptography>=44",
]

[tool.uv.sources]
allskyhub-protocol = { workspace = true }

[project.scripts]
allskyhub-server = "allskyhub_server.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
