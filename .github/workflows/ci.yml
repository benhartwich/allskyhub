# Checks required before merging (CLAUDE.md): ruff, pyright strict, pytest, REUSE.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    # Hub tests (server/tests) need PostgreSQL; without the URL they are skipped.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allskyhub
          POSTGRES_PASSWORD: allskyhub
          POSTGRES_DB: allskyhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allskyhub" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ALLSKYHUB_SERVER_TEST_DATABASE_URL: postgresql://allskyhub:allskyhub@127.0.0.1:5432/allskyhub_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      # The hub renders timelapses with ffmpeg (roadmap C8); its tests skip without it.
      # ubuntu-26.04 has no ffmpeg; a slow mirror once took 27 minutes here.
      - run: command -v ffmpeg || (sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg)
        timeout-minutes: 10
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q -rs
      - run: uvx --from 'reuse[charset-normalizer]' reuse lint

  # Shell scripts: the deploy and backup scripts run as root on the hub, image/build.sh
  # builds the Pi image. ShellCheck comes with the runner image.
  shell:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: shellcheck --version
      - run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck

  # Flutter app (app/): format, analyze, test. Native builds: app-build.yml.
  app:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
