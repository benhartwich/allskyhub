# Codemagic builds of the Flutter app (app/, SPEC §2, M3).
#
# The release workflows read every key from the app's secure variable group
# "allskyhub_store", which the hub fills: admin page → App-Stores → "Prüfen und einrichten"
# (server/src/allskyhub_server/admin/stores.py). It holds the Play service account, the
# Android upload keystore (made by the hub), the App Store Connect API key and the private
# key of the iOS distribution certificate (made by the hub). No keystore upload or App
# Store Connect integration in the Codemagic UI is needed.
# The check workflow needs none of that.

definitions:
  flutter: &flutter
    flutter: stable
  app_dir: &app_dir
    working_directory: app
  scripts:
    - &get
      name: Packages
      script: flutter pub get
    - &check
      name: Analyze and test
      script: |
        dart format --output=none --set-exit-if-changed lib test
        flutter analyze
        flutter test

workflows:
  # Manual: analyze, test, debug APK, unsigned iOS build. Every app change is already
  # compiled on GitHub Actions (.github/workflows/app-build.yml); this one saves mac minutes.
  app-check:
    name: App check
    instance_type: mac_mini_m2
    max_build_duration: 45
    <<: *app_dir
    environment:
      <<: *flutter
      xcode: latest
    scripts:
      - *get
      - *check
      - name: Android debug APK
        script: flutter build apk --debug
      - name: iOS build without signing
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  # Manual: signed Android App Bundle to the Play Store internal track.
  android-release:
    name: Android release
    instance_type: linux_x2
    max_build_duration: 45
    <<: *app_dir
    environment:
      <<: *flutter
      groups: [allskyhub_store]
    scripts:
      - *get
      - *check
      - name: Upload key
        script: |
          echo "$ALLSKYHUB_UPLOAD_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/upload.p12"
          echo "ALLSKYHUB_KEYSTORE=$CM_BUILD_DIR/upload.p12" >> "$CM_ENV"
      - name: App Bundle
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # Manual: signed iOS build to TestFlight. The certificate and profile come from Apple
  # with the hub's key (fetch-signing-files --create makes them on the first run).
  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    <<: *app_dir
    environment:
      <<: *flutter
      xcode: latest
      groups: [allskyhub_store]
    scripts:
      - *get
      - *check
      - name: Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files org.allskyhub.app --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
